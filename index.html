    <style id="app-css">
/* Self-hosted latin variable subset of JetBrains Mono, SIL OFL.
   The file's weight axis is 400–800, and this face exposes that full range.
   The UI uses 400, 500, and 700.
   Inlined into index.html. After editing, run npm run build. */
@font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url("/assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
    --frame-width: 393px;
    --frame-height: 852px;
    --page-padding-x: 24px;
    --page-padding-top: max(16px, env(safe-area-inset-top));
    --page-padding-bottom: 24px;
    --section-gap: 16px;
    --single-bg: #c20707;
    --text: #ffffff;
    --border: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --dimmed: rgba(255, 255, 255, 0.46);
    --font-family: "JetBrains Mono", monospace;
    --header-size: 15px;
    --single-label-size: 15px;
    --single-value-size: clamp(36px, 13vw, 54px);
    --single-value-line: 0.96;
    --single-field-gap: clamp(18px, 4vh, 30px);
    --single-control-height: 48px;
    --single-footer-gap: 18px;
    --single-circle-size: clamp(84px, 25vw, 102px);
    --single-reset-height: 22px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* The document must not scroll. iOS paints a scroll-edge blur over the
   header when html/body themselves can move under the status bar. */
html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    position: fixed;
    inset: 0;
    background: var(--single-bg);
    color: var(--text);
    font-family: var(--font-family);
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums slashed-zero;
    transition: background-color 160ms ease;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    background: none;
    color: inherit;
}

[hidden] {
    display: none !important;
}

.ctds-app {
    position: relative;
    width: min(100%, var(--frame-width));
    height: min(100dvh, var(--frame-height));
    max-height: 100dvh;
    margin: 0 auto;
    padding: var(--page-padding-top) var(--page-padding-x) var(--page-padding-bottom);
    display: flex;
    flex-direction: column;
    gap: var(--section-gap);
    overflow: hidden;
}

.ctds-scroll {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
}

.ctds-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 26px;
}

.ctds-header-title {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.ctds-header-label {
    font-size: var(--header-size);
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0;
}

.ctds-brand-mark {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: block;
}

.ctds-brand-mark svg {
    display: block;
    width: 24px;
    height: 24px;
}

.ctds-toggle:focus-visible,
.ctds-circle:focus-visible,
.ctds-reset-btn:focus-visible {
    outline: 1px solid rgba(255, 255, 255, 0.96);
    outline-offset: 2px;
}

.ctds-single-shell {
    display: flex;
    flex-direction: column;
    flex: 1 0 auto;
    min-height: min-content;
}

.ctds-main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--single-field-gap);
    min-height: 0;
    padding: 10px 0 12px;
}

.ctds-field {
    display: grid;
    grid-template-columns: minmax(66px, auto) minmax(0, 1fr);
    align-items: end;
    column-gap: 12px;
    width: 100%;
}

.ctds-label {
    justify-self: start;
    align-self: end;
    font-size: var(--single-label-size);
    line-height: 1.15;
    color: var(--muted);
    padding-bottom: 8px;
    white-space: nowrap;
}

.ctds-value {
    width: 100%;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    text-align: right;
    font-size: var(--single-value-size);
    line-height: var(--single-value-line);
    letter-spacing: -0.07em;
    caret-color: var(--text);
}

.ctds-field--time .ctds-value {
    max-width: 8.4ch;
    justify-self: end;
}

.ctds-field--distance .ctds-value,
.ctds-field--speed .ctds-value {
    max-width: 5.65ch;
    justify-self: end;
}

.ctds-field--pace .ctds-value {
    max-width: 5.1ch;
    justify-self: end;
}

.ctds-value::placeholder {
    color: currentColor;
    opacity: 1;
}

.ctds-value:disabled {
    cursor: not-allowed;
    -webkit-text-fill-color: currentColor;
    opacity: 1;
}

.ctds-field.is-target .ctds-label,
.ctds-field.is-target .ctds-value {
    color: var(--dimmed);
}

.ctds-field.is-nontarget .ctds-label,
.ctds-field.is-nontarget .ctds-value {
    color: var(--text);
}

.ctds-controls {
    display: flex;
    flex-direction: column;
    gap: var(--single-footer-gap);
}

.ctds-toggle-row {
    display: flex;
}

.ctds-toggle {
    flex: 1 1 50%;
    height: var(--single-control-height);
    border: 1px solid var(--border);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
}

.ctds-toggle + .ctds-toggle {
    margin-left: -1px;
}

.ctds-toggle.is-active {
    background: var(--text);
    color: var(--single-bg);
}

.ctds-circles {
    display: flex;
    justify-content: space-between;
    gap: 14px;
}

.ctds-circle {
    flex: 1 1 0;
    min-width: 0;
    aspect-ratio: 1 / 1;
    max-width: var(--single-circle-size);
    border: 1px solid var(--border);
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
    font-size: 15px;
    line-height: 1.15;
    cursor: pointer;
}

.ctds-circle.is-active {
    background: var(--text);
    color: var(--single-bg);
}

.ctds-reset {
    display: flex;
    align-items: center;
    min-height: var(--single-reset-height);
}

.ctds-reset-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 22px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
}

.ctds-reset-icon {
    font-size: 22px;
    line-height: 22px;
    height: 22px;
    overflow: hidden;
}

.ctds-announcer {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

@media (max-width: 420px) {
    :root {
        --single-value-size: clamp(34px, 12.4vw, 50px);
        --single-label-size: 14px;
        --single-field-gap: clamp(17px, 3.8vh, 26px);
    }

    .ctds-field {
        grid-template-columns: minmax(58px, auto) minmax(0, 1fr);
        column-gap: 10px;
    }

    .ctds-circles {
        gap: 12px;
    }

    .ctds-circle {
        font-size: 14px;
    }
}

@supports not (height: 100dvh) {
    html,
    body {
        height: 100%;
        max-height: none;
    }

    .ctds-app {
        height: min(100vh, var(--frame-height));
        max-height: 100vh;
    }
}
</style>
</head>
<body>
    <div class="ctds-app">
        <header class="ctds-header">
            <span class="ctds-header-title">
                <span class="ctds-brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 8 8" width="24" height="24" fill="currentColor" shape-rendering="crispEdges">
                        <rect x="1" y="1" width="1" height="1"/>
                        <rect x="0" y="2" width="1" height="1"/>
                        <rect x="3" y="2" width="4" height="1"/>
                        <rect x="1" y="3" width="1" height="1"/>
                        <rect x="6" y="4" width="1" height="1"/>
                        <rect x="1" y="5" width="4" height="1"/>
                        <rect x="7" y="5" width="1" height="1"/>
                        <rect x="6" y="6" width="1" height="1"/>
                    </svg>
                </span>
                <span class="ctds-header-label">DTS-Calc</span>
            </span>
        </header>

        <div class="ctds-scroll">
        <div class="ctds-single-shell" id="singlePaceApp">
            <main class="ctds-main">
                <div class="ctds-field ctds-field--time is-target">
                    <label class="ctds-label" for="timeInput" id="timeLabel">HH:MM:SS</label>
                    <input type="text"
                           class="ctds-value"
                           id="timeInput"
                           placeholder="00:00:00"
                           aria-describedby="timeLabel"
                           aria-disabled="true">
                </div>

                <div class="ctds-field ctds-field--distance is-nontarget">
                    <label class="ctds-label" for="distanceInput" id="distanceLabel">KM</label>
                    <input type="text"
                           class="ctds-value"
                           id="distanceInput"
                           placeholder="00.00"
                           aria-describedby="distanceLabel"
                           inputmode="decimal">
                </div>

                <div class="ctds-field ctds-field--speed is-nontarget">
                    <label class="ctds-label" for="speedInput" id="speedLabel">KM/H</label>
                    <input type="text"
                           class="ctds-value"
                           id="speedInput"
                           placeholder="00.00"
                           aria-describedby="speedLabel"
                           inputmode="decimal">
                </div>

                <div class="ctds-field ctds-field--pace is-nontarget">
                    <label class="ctds-label" for="paceInput" id="paceLabel">MIN/KM</label>
                    <input type="text"
                           class="ctds-value"
                           id="paceInput"
                           placeholder="00:00"
                           aria-describedby="paceLabel"
                           inputmode="numeric">
                </div>
            </main>

            <footer class="ctds-controls">
                <div class="ctds-toggle-row">
                    <button class="ctds-toggle" id="unitToggle" type="button">Metric</button>
                    <button class="ctds-toggle" id="imperialToggle" type="button">Imperial</button>
                </div>

                <div class="ctds-circles">
                    <button class="ctds-circle is-active" id="timeBtn" aria-pressed="true" type="button">Time</button>
                    <button class="ctds-circle" id="distanceBtn" aria-pressed="false" type="button">Distance</button>
                    <button class="ctds-circle" id="speedBtn" aria-pressed="false" type="button">Speed</button>
                </div>

                <div class="ctds-reset">
                    <button class="ctds-reset-btn" id="resetBtn" type="button">
                        <span class="ctds-reset-icon" aria-hidden="true">↺</span>
                        <span class="ctds-reset-text">Reset</span>
                    </button>
                </div>
            </footer>
        </div>

        </div>

        <div id="ann" role="status" aria-live="polite" class="ctds-announcer"></div>
    </div>

    <script type="module" src="js/calculator.js"></script>
    <script>
        window.addEventListener('load', function () {
            if (!('serviceWorker' in navigator)) return;
            navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
    </script>
</body>
</html>
